[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tele-bot-game"
version = "2.0.0"
description = "Tiramix City Life Simulator Telegram Bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20.0",
    "Pillow>=10.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["handlers*", "services*", "database*", "models*"]
exclude = ["tests*", "cache*", "data*", "assets*", "scripts*"]

[tool.setuptools]
py-modules = ["main", "config", "logging_conf"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts", ".venv", "cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "SIM108",   # ternaries are not always clearer
    "B008",     # aiogram filters in defaults are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["scripts", ".venv", "cache"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q"
